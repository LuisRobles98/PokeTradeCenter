<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/generico/images/poketDexNoText.ico" type="image/x-icon">
    <title>PoketDex</title>
    <link rel="stylesheet" href="/paginaPrincipal/css/paginaPrincipal.css">
    <link rel="stylesheet" href="/generico/css/generico.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/generico/js/generico.js" defer></script>
    <script src="/paginaPrincipal/js/llamadasAjax.js" defer></script>
    <script src="/paginaPrincipal/js/paginaPrincipal.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>	
 	<!-- Popup Principal-->
	<div id="popupPrincipal" class="popup">
	    <div class="popup-content">
	        <img src="/paginaPrincipal/images/poketDex.png" alt="PoketDex" style="width: 120px;">
	        <div class="botones">
				<button id="btnIniciarSesion">Iniciar sesión</button>
	        	<button id="btnRegistrarse">Registrarse</button>
			</div>
	    </div>
	</div>

	<div id="popupIniciarSesion" class="popup" style="display: none;">
	    <div class="popup-content">
	        <img src="/paginaPrincipal/images/poketDex.png" alt="PoketDex" style="width: 120px;">
		 	<input required id="inputCorreoInicioSesion" type="email" placeholder="Correo electrónico">
		 	<input required id="inputPasswordInicioSesion" type="password" placeholder="Contraseña">
		 	<div class="botones">
				 <button id="btnVolverInicioSesion">Volver</button>
				<button id="btnAcceder">Acceder</button>
			</div>
	    </div>
	</div>
	

	<div id="popupRegistrarse" class="popup" style="display: none;">
	    <div class="popup-content">
	        <img src="/paginaPrincipal/images/poketDex.png" alt="PoketDex" style="width: 120px;">
	        <input required id="inputUsuarioRegistro" type="text" placeholder="Usuario">
	        <input required id="inputCorreoRegistro" type="email" placeholder="Correo electrónico">
	        <input required id="inputPasswordRegistro" type="password" placeholder="Contraseña">
	        <input required id="inputPassword2Registro" type="password" placeholder="Vuelva a introducir la contraseña">
	        <div class="botones">
				<button id="btnVolverRegistrarse">Volver</button>
	        	<button id="btnConfirmarRegistrarse">Registrarse</button>
	        </div>
	    </div>
	</div>

</body>
</html>
