<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTradeCenter</title>
    <link rel="stylesheet" href="/paginaPrincipal/css/paginaPrincipal.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/paginaPrincipal/js/llamadasAjax.js" defer></script>
    <script src="/paginaPrincipal/js/paginaPrincipal.js" defer></script>
</head>
<body>
 	<!-- Popup Principal-->
	<div id="popupPrincipal" class="popup">
	    <div class="popup-content">
	        <h2>PokeTradeCenter</h2>
	        <button id="btnIniciarSesion">Iniciar sesión</button>
	        <button id="btnRegistrarse">Registrarse</button>
	    </div>
	</div>

	<div id="popupIniciarSesion" class="popup" style="display: none;">
	    <div class="popup-content">
	        <h2>PokeTradeCenter</h2>
		 	<input required id="inputCorreoInicioSesion" type="text" placeholder="Correo electronico">
		 	<input required id="inputPasswordInicioSesion" type="text" placeholder="Contraseña">
			<button id="btnAcceder">Acceder</button>
			<button id="btnVolverInicioSesion">Volver</button>
	    </div>
	</div>
	

	<div id="popupRegistrarse" class="popup" style="display: none;">
	    <div class="popup-content">
	        <h2>PokeTradeCenter</h2>
	        <input required id="inputUsuarioRegistro" type="text" placeholder="Usuario">
	        <input required id="inputCorreoRegistro" type="text" placeholder="Correo electronico">
	        <input required id="inputPasswordRegistro" type="text" placeholder="Contraseña">
	        <input required id="inputPassword2Registro" type="text" placeholder="Vuelva a introducir la contraseña">
	        <button id="btnConfirmarRegistrarse">Registrarse</button>
	        <button id="btnVolverRegistrarse">Volver</button>
	    </div>
	</div>

</body>
</html>
