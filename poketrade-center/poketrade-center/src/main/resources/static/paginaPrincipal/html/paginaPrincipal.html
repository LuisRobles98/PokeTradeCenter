<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/generico/imagenes/poketDexNoText.ico" type="image/x-icon">
    <title>PoketDex</title>
    <link rel="stylesheet" href="/generico/css/body.css">
    <link rel="stylesheet" href="/generico/css/barraSuperior.css">
    <link rel="stylesheet" href="/generico/css/estilos.css">
    <link rel="stylesheet" href="/paginaPrincipal/css/paginaPrincipal.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="/generico/js/generico.js" defer></script>
    <script src="/paginaPrincipal/js/llamadasAjax.js" defer></script>
    <script src="/paginaPrincipal/js/paginaPrincipal.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="paginaPrincipalFondo">	

	<div id="popupIniciarSesion" class="popupConfirmar">
	    <div class="contenidoPopup">
	        <img src="/paginaPrincipal/imagenes/poketDex.png" class="imagen">
	        <div class="divInputs">
		 		<input required id="inputCorreoInicioSesion" class="inputs input" type="email" placeholder="Correo electrónico">
		 		<input required id="inputPasswordInicioSesion" class="inputs input" type="password" placeholder="Contraseña">
		 	</div>
		 	<div class="botonera">
				<button id="btnRegistrarse" class="botones aceptar">Registrarse</button>
				<button id="btnAcceder" class="botones aceptar">Acceder</button>
			</div>
	    </div>
	</div>
	
	<div id="popupRegistrarse" class="popupConfirmar" style="display: none;">
	    <div class="contenidoPopup">
	        <img src="/paginaPrincipal/imagenes/poketDex.png" class="imagen">
	        <div class="divInputs">
		        <input required id="inputUsuarioRegistro" class="inputs input" type="text" placeholder="Usuario">
	        	<input required id="inputCorreoRegistro" class="inputs input" type="email" placeholder="Correo electrónico">
	        	<input required id="inputPasswordRegistro" class="inputs input" type="password" placeholder="Contraseña">
	        	<input required id="inputPassword2Registro" class="inputs input" type="password" placeholder="Vuelva a introducir la contraseña">
			</div>
	        <div class="botonera">
				<button id="btnVolverRegistrarse" class="botones cancelar">Volver</button>
	        	<button id="btnConfirmarRegistrarse" class="botones aceptar">Registrarse</button>
	        </div>
	    </div>
	</div>

</body>
</html>
