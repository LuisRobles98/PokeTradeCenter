<body class="fondo">

	<!-- cargar Barra superior -->
	<div id="barraContainer"></div>


	<!-- lista de cartas que serán para hacer la oferta de intercambio -->

	<span class="label labelQuererCartas">Cartas que quiero</span>
	<div id="baraja" class="baraja">
		<div id="ofrecer" class="ofrecerQuerer">
			<div id="seleccionadaOfrecer" class="tipoIntercambio" data-id="true">

			</div>
			<span class="labelInfoRojo">Selecciona el botón para poder añadir cartas a la lista</span>
