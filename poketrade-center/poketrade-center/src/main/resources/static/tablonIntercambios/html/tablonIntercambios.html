<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/generico/imagenes/poketDexNoText.ico" type="image/x-icon">
	<title>PoketDex</title>
	<link rel="stylesheet" href="/generico/css/generico.css">
	<link rel="stylesheet" href="/tablonIntercambios/css/tablonIntercambios.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
	<script src="/generico/js/generico.js" defer></script>
	<script src="/tablonIntercambios/js/llamadasAjax.js" defer></script>
	<script src="/tablonIntercambios/js/tablonIntercambios.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script type="text/javascript" src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
	<script defer>document.addEventListener("DOMContentLoaded", function () {barraSuperior.cargar();});</script>
</head>

<body class="fondo">

	<!-- cargar Barra superior -->
	<div id="barraContainer"></div>
	
	<div id="popupTablaIntercambiosBuscador" class="popupTablaIntercambiosBuscador popup">
		<div id="contenidoBuscador" class="contenidoBuscador">
			<span id="textoCartas" class="textoCartas label">Nombre de cartas recibir/dar</span>
			<input id="inputNombreCartaOfrecer"class="inputNombreCartaOfrecer input" placeholder="Carta para recibir">
			<input id="inputNombreCartaQuerer"class="inputNombreCartaQuerer input" placeholder="Carta para dar">
			<span id="textoOrden" class="textoOrden label">Ordenación</span>
			<div id="botonesOrden" class="botonesOrden">
				<div id="antiguas" class="botonOrden boton" data-id="fecha_asc">
					<span class="fuenteNormal">Antiguas</span>
				</div>
				<div id="nuevas" class="botonOrden boton" data-id="fecha_desc">
					<span class="fuenteNormal">Nuevas</span>
				</div>
			</div>
		</div>
	</div>

	<div id="popupTablaIntercambios" class="popupTablaIntercambios popup">
		<div id="actualizar" class="actualizar">
			<span id="textoActualizar" class="textoActualizar label">Actualizar</span>
			<i id="botonActualizar" class="fa-solid fa-arrows-rotate iconoFontAwesomeNoCircle"></i>
		</div>
		<div id="tablaIntercambios"></div>
	</div>

	<div id="popupMostrarIntercambio" class="popupMostrarIntercambio popup">
		<span id="textoOfrecer" class="label"></span>
		<div id="mostrarCartasOfrecer" class="mostrarCartasOfrecer"></div>
		<span id="textoQuerer" class="label"></span>
		<div id="mostrarCartasQuerer" class="mostrarCartasQuerer"></div>
		
		<div id="divCartaQuererYo" class="divCartaQuererYo"></div>
		<span id="textoQuererYo" class="textoQuererYo label"></span>
		<i class="fa-solid fa-arrow-right flechaIntercambiarQuererYo"></i>
		<div id="cartaQuererYo" class="cartaQuererYo"></div>
		<div id="divCartaOfrecerYo" class="divCartaOfrecerYo"></div>
		<span id="textoOfrecerYo" class="textoOfrecerYo label"></span>
		<i class="fa-solid fa-arrow-right flechaIntercambiarOfrecerYo"></i>
		<div id="cartaOfrecerYo" class="cartaOfrecerYo"></div>
		<button id="btnSolicitarIntercambio" class="btnSolicitarIntercambio aceptar">Solicitar intercambio</button>
	</div>
		
	<div id="confirmarIntercambio" class="confirmar" style="display: none;">
		<div id="contenidoConfirmar" class="contenidoConfirmar">
			<span for="textoConfirmacion" class="textoConfirmacion">¿Estás seguro que quieres solicitar este intercambio?</span>
			<div id="botonera" class="botoneraConfirmar">
				<button id="btnCancelar" class="btnCancelar cancelar">Cancelar</button>
				<button id="btnSolicitar" class="btnSolicitar aceptar">Solicitar</button>
			</div>
		</div>
	</div>

</body>
