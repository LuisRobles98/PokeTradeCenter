<!DOCTYPE html>

	<link rel="icon" href="/generico/imagenes/poketDexNoText.ico" type="image/x-icon">
	<title>PoketDex</title>
	<link rel="stylesheet" href="/generico/css/generico.css">
	<link rel="stylesheet" href="/crearBarajas/css/crearBarajas.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="/generico/js/generico.js" defer></script>
	<script src="/crearBarajas/js/llamadasAjax.js" defer></script>
	<script src="/crearBarajas/js/crearBarajas.js" defer></script>
	<script>$(document).ready(function () {barraSuperior.cargar();});</script>

<body class="fondo">

	<!-- cargar Barra superior -->

		</div>
	</div>

					<div id="expansion2carta" class="expansionCarta" data-id="2">

						<img id="expansionFestivalBrillante" src="/imagenes/expansiones/5.png" class="expansionLogo">
					</div>
					<div id="expansion6carta" class="expansionCarta" data-id="6">

					</div>
				</div>
				<div class="expansion">

						<img id="expansionManantialOculto" src="/imagenes/expansiones/10.png" class="expansionLogo">
					</div>
					<div id="expansion12carta" class="expansionCarta" data-id="12">

					</div>
				</div>
			</div>
			<div id="selectRarezaCarta" class="selectRarezasCarta">
				<span class="label">Rarezas</span>
				<div class="rareza">
					<div id="romboX1RarezaCarta" class="rarezaCarta" data-id="1">
						<img src="/imagenes/rarezas/rombo.png">
					</div>
					<div id="romboX2RarezaCarta" class="rarezaCarta" data-id="2">

						<img src="/imagenes/rarezas/rombo.png">
						<img src="/imagenes/rarezas/rombo.png">
						<img src="/imagenes/rarezas/rombo.png">
					</div>
					<div id="romboX4RarezaCarta" class="rarezaCarta" data-id="4">

					<div id="metalicaEnergiaCarta" class="energiaCarta" data-id="8">
						<img src="/imagenes/energias/energiaMetalica.png">
					</div>
					<div id="dragonEnergiaCarta" class="energiaCarta" data-id="9">
						<img src="/imagenes/energias/energiaDragon.png">
					</div>
					<div id="incoloraEnergiaCarta" class="energiaCarta" data-id="10">

	<div id="resultadosCartas">
		<div class="resultadosCartas">
			<div id="mostrarCartas" class="mostrarCartas"></div>
		</div>

	<div id="confirmar" class="confirmar" style="display: none;">
		<div id="contenidoConfirmar" class="contenidoConfirmar">
			<span for="textoConfirmacion" class="textoConfirmacion">¿Qué deseas hacer con esta baraja?</span>
			<div id="botonera" class="botoneraConfirmar">
				<button id="btnCancelar" class="botonCancelar">Cancelar</button>
				<button id="btnGuardar" class="botonAceptar">Guardar</button>
				<button id="btnPublicar" class="botonAceptar">Publicar</button>
