<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoketDexMenu</title>
    <link rel="stylesheet" href="/generico/css/generico.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/menuPrincipal/js/llamadasAjax.js" defer></script>
    <script src="/menuPrincipal/js/menuPrincipal.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
	<!-- Popup Insertar id de usuario-->
	<div id="popupInsertarIdUsuario" class="popup">
	    <div class="popup-content">
			<label for="inputIdUsuario">Bienvenido a PoketDex</label>
			<label for="inputIdUsuario">Como es la primera vez que entras en la aplicación deberas añadir el id del juego.</label>
			<label for="inputIdUsuario">Para ello accede al juego y busca este icono en la pantalla de inicio</label>
	        <img src="/menuPrincipal/images/iconoMenuPrincipalIdUsuario.png" alt="IconoIdUsuario" style="width: 40px;">
	        <label for="inputIdUsuario">Presionalo y abajo del todo estara tu id de usuario</label>
	        <input required id="inputIdUsuario" type="text" placeholder="id de usuario">
	        <div class="botones">
	        	<button id="btnAceptarIdUsuario">Añadir id usuario</button>
			</div>
	    </div>
	</div>
</body>
</html>
