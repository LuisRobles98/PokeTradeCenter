<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/generico/imagenes/poketDexNoText.ico" type="image/x-icon">
    <title>PoketDex</title>
    <link rel="stylesheet" href="/generico/css/body.css">
    <link rel="stylesheet" href="/generico/css/barraSuperior.css">
    <link rel="stylesheet" href="/generico/css/estilos.css">
    <link rel="stylesheet" href="/menuPrincipal/css/menuPrincipal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="/generico/js/generico.js" defer></script>
    <script src="/menuPrincipal/js/llamadasAjax.js" defer></script>
    <script src="/menuPrincipal/js/menuPrincipal.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer>document.addEventListener("DOMContentLoaded", function () {barraSuperior.cargar();});</script>
</head>
<body class="fondo">
	
	<!-- cargar Barra superior -->
	<div id="barraContainer"></div>

	<!-- Popup Insertar id del juego del usuario-->
	<div id="popupInsertarIdJuego" class="popupConfirmar" style="display: none;">
	    <div class="contenidoIncluirIdJuego">
			<label for="inputIdJuego" class="label">¡Bienvenido a PoketDex!<br>
			Como es la primera vez que accedes a la aplicación, necesitas añadir tu Id de "Pokémon TCG Pocket".<br>
			Para obtenerlo, abre el juego y busca el siguiente icono en la pantalla de inicio:</label>
	        <img src="/menuPrincipal/imagenes/iconoMenuPrincipalIdJuego.png" class="imagenIncluirIdJuego">
	        <label for="inputIdJuego" class="label"><br>Presiona ese icono y encontrarás tu Id al final de la pantalla.</label>
	        <input required id="inputIdJuego" class="inputIncluirIdJuego input" type="text" placeholder="Id del juego">
	        <button id="btnAceptarIdJuego" class="btnIncluirIdJuego aceptar">Añadir id del juego</button>
	    </div>
	</div>
		
	<!-- Primera fila -->
	<div id="iconosAplicaciones" class="iconosAplicaciones">
	    <div id="crearIntercambioApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appCrearIntercambio.png"></i>
	        <span class="labelApp">Crear Intercambio</span>
	    </div>
	    <div id="intercambiosActivosApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appIntercambiosActivos.png"></i>
	        <span class="labelApp">Intercambios Activos</span>
	    </div>
	    <div id="tablonIntercambiosApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appTablonIntercambios.png"></i>
	        <span class="labelApp">Tablón de Intercambios</span>
	    </div>
	    <div id="coleccionCartasApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appColeccionCartas.png">
	        <span class="labelApp">Colección de Cartas</span>
	    </div>
	     <div id="crearBarajasApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appCrearBarajas.png"></i>
	        <span class="labelApp">Crear Barajas</span>
	    </div>
	    <div id="misBarajasApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appMisBarajas.png"></i>
	        <span class="labelApp">Mis Barajas</span>
	    </div>
	    <div id="barajasPublicasApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appBarajasPublicas.png"></i>
	        <span class="labelApp">Barajas Públicas</span>
	    </div>
	     <div id="perfilApp" class="appMenu">
	        <img class="imagenApp"src="/imagenes/apps/appPerfil.png">
	        <span class="labelApp">Perfil</span>
	    </div>
	</div>	
</body>
</html>
